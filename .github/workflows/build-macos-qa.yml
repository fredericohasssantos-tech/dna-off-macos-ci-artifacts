name: Build encrypted macOS 12 Intel QA installer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: encrypted-macos-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: macOS 12 Intel (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel

    env:
      CI: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      SPLITTER_OFFLINE: '1'
      SPLITTER_ENGINE_VENV: engine/.venv-${{ matrix.arch }}
      MACOSX_DEPLOYMENT_TARGET: '12.0'

    steps:
      - name: Check out encrypted build payload
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.14.0
          architecture: ${{ matrix.arch }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.10'
          architecture: ${{ matrix.arch }}

      - name: Decrypt private source in the ephemeral runner
        env:
          SOURCE_PASSPHRASE: ${{ secrets.SOURCE_PASSPHRASE }}
        shell: bash
        run: |
          test -n "$SOURCE_PASSPHRASE"
          node crypt-source.mjs decrypt source.tar.gz.enc source.tar.gz
          mkdir source
          tar -xzf source.tar.gz -C source

      - name: Confirm native runner architecture
        working-directory: source
        shell: bash
        run: |
          node -e "if (process.platform !== 'darwin' || process.arch !== '${{ matrix.arch }}') process.exit(1)"
          python -c "import platform,sys; expected='${{ matrix.arch }}'; actual={'x86_64':'x64','arm64':'arm64'}.get(platform.machine().lower()); assert sys.platform == 'darwin' and sys.version_info[:2] == (3,12) and actual == expected, (sys.platform, platform.python_version(), actual, expected)"
          sw_vers

      - name: Install application dependencies
        working-directory: source
        run: npm ci

      - name: Prepare native offline engine
        working-directory: source
        env:
          SPLITTER_ENGINE_PYTHON: python3
        run: npm run engine:setup:mac:${{ matrix.arch }}

      - name: Select native engine Python
        working-directory: source
        shell: bash
        run: |
          engine_python="$GITHUB_WORKSPACE/source/engine/.venv-${{ matrix.arch }}/bin/python"
          test -x "$engine_python"
          "$engine_python" -c "import platform,sys; expected='${{ matrix.arch }}'; actual={'x86_64':'x64','arm64':'arm64'}.get(platform.machine().lower()); assert sys.version_info[:2] == (3,12) and actual == expected, (platform.python_version(), actual, expected)"
          echo "SPLITTER_ENGINE_PYTHON=$engine_python" >> "$GITHUB_ENV"

      - name: Run source and contract checks
        working-directory: source
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run test:engine
          npm run test:integration
          npm run verify:offline

      - name: Build and test mounted DMG
        working-directory: source
        run: npm run dist:mac:${{ matrix.arch }}

      - name: Confirm QA-only status and create checksum
        working-directory: source
        shell: bash
        run: |
          product_name="$(node -p 'require("./package.json").desktopName')"
          version="$(node -p 'require("./package.json").version')"
          dmg="${product_name}-${version}-macOS-${{ matrix.arch }}.dmg"
          test -f "release/${dmg}"
          if /usr/bin/codesign --verify --strict "release/${dmg}" >/dev/null 2>&1; then
            echo 'The QA DMG unexpectedly has a valid code signature.' >&2
            exit 1
          fi
          if /usr/bin/xcrun stapler validate "release/${dmg}" >/dev/null 2>&1; then
            echo 'The QA DMG unexpectedly has a notarization ticket.' >&2
            exit 1
          fi
          cd release
          shasum -a 256 "${dmg}" > "${dmg}.sha256"
          printf '%s\n' \
            'QA INSTALLER — UNSIGNED AND NOT NOTARIZED' \
            'Built and runtime-tested on a native GitHub-hosted Mac.' \
            'Intel x64 build targeting macOS 12.0; intended for Monterey 12.7.6 or newer.' \
            'Gatekeeper may require using Finder > right-click > Open.' \
            > "QA-ONLY-${{ matrix.arch }}.txt"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "${dmg}" "${dmg}.sha256" "QA-ONLY-${{ matrix.arch }}.txt" "$GITHUB_WORKSPACE/artifacts/"

      - name: Remove decrypted source before artifact upload
        working-directory: ${{ github.workspace }}
        shell: bash
        run: rm -rf source source.tar.gz

      - name: Upload tested installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dna-off-macos-12-qa-unsigned-${{ matrix.arch }}
          path: |
            artifacts/*-macOS-${{ matrix.arch }}.dmg
            artifacts/*-macOS-${{ matrix.arch }}.dmg.sha256
            artifacts/QA-ONLY-${{ matrix.arch }}.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
